version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: smartwash-backend:1.0.0
    container_name: smartwash-backend
    restart: unless-stopped
    ports:
      - "4550:4550"
    environment:
      - CORS_ORIGINS=*
      - PORT=4550
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4550/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - smartwash-network
    deploy:
      resources:
        limits:
          memory: 2048M
        reservations:
          memory: 512M

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: smartwash-frontend:1.0.0
    container_name: smartwash-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/"]
      interval: 20s
      timeout: 3s
      retries: 3
    networks:
      - smartwash-network

networks:
  smartwash-network:
    name: smartwash-network
    driver: bridge
